<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Fun! ⭐ Kids Math Practice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            kid: ['Comic Sans MS', 'Chalkboard SE', 'Comic Neue', 'cursive', 'sans-serif'],
          },
          colors: {
            kidgreen: '#4ADE80',
            kidblue: '#60A5FA',
            kidpurple: '#C084FC',
            kidyellow: '#FACC15',
            kidpink: '#F472B6',
            kidorange: '#FB923C',
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fce7f3 50%, #fef3c7 100%);
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }
    .btn-big {
      min-width: 80px;
      min-height: 80px;
      font-size: 1.75rem;
      border-radius: 1.5rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      border: 4px solid transparent;
    }
    .btn-big:hover, .btn-big:focus {
      transform: scale(1.08);
      outline: none;
    }
    .btn-big:active {
      transform: scale(0.95);
    }
    .btn-big:focus-visible {
      box-shadow: 0 0 0 4px #3b82f6;
    }
    .card-grade {
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card-grade:hover {
      transform: translateY(-8px) scale(1.02);
    }
    .answer-btn {
      min-width: 100px;
      min-height: 90px;
      font-size: 2.5rem;
      font-weight: bold;
    }
    .shape-btn {
      min-width: 120px;
      min-height: 120px;
    }
    .animate-bounce-slow {
      animation: bounce 2s infinite;
    }
    .animate-pop {
      animation: pop 0.4s ease;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .star-burst {
      animation: starBurst 0.8s ease forwards;
    }
    @keyframes starBurst {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(180deg); opacity: 1; }
      100% { transform: scale(2) rotate(360deg); opacity: 0; }
    }
    .progress-bar {
      height: 16px;
      border-radius: 9999px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #22c55e);
      transition: width 0.4s ease;
      border-radius: 9999px;
    }
    .object-emoji {
      font-size: 2.5rem;
      display: inline-block;
      margin: 2px;
      transition: transform 0.3s;
    }
    .object-emoji.leaving {
      transform: translateX(-50px) scale(0);
      opacity: 0;
    }
    .object-emoji.joining {
      animation: joinIn 0.5s ease;
    }
    @keyframes joinIn {
      from { transform: translateX(40px) scale(0); opacity: 0; }
      to { transform: translateX(0) scale(1); opacity: 1; }
    }
    .clock-face {
      position: relative;
      width: 220px;
      height: 220px;
      border: 8px solid #1e3a5f;
      border-radius: 50%;
      background: white;
      margin: 0 auto;
    }
    .clock-hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      background: #1e3a5f;
      border-radius: 4px;
    }
    .clock-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      background: #ef4444;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
    .hint-box {
      background: #fef9c3;
      border: 3px solid #facc15;
      border-radius: 1rem;
      padding: 1rem;
    }
    .parent-gate input {
      font-size: 1.5rem;
      letter-spacing: 0.5rem;
      text-align: center;
      width: 180px;
    }
    /* High contrast focus */
    button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
      outline: 4px solid #2563eb;
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" src="app.js"></script>
</body>
</html>
